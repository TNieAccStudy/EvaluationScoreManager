<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{affairs/base :: base(~{::title}, ~{::div.content}, ~{::#custom-links}, ~{::#custom-javascripts})}">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Activity detail template</title>

        <th:block id="custom-links">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        </th:block>

    </header>
    <body>

        <div class="content">
            <form th:action="@{/affairs/exec/activities}" th:object="${activity}" method="post" class="needs-validation" novalidate>
                <!-- Hidden field for ID -->
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{studentAssistantId}" />

                <!-- Title -->
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" th:field="*{title}" class="form-control" id="title" 
                           required minlength="1" maxlength="255" placeholder="Enter activity title">
                    <div class="invalid-feedback">
                        Title is required and must be between 1 and 255 characters.
                    </div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" id="description" rows="5" 
                              maxlength="2147483647" placeholder="Enter activity description"></textarea>
                    <div class="invalid-feedback">
                        Description is required.
                    </div>
                </div>

                <!-- Bonus Score -->
                <div class="mb-3">
                    <label for="bonusScore" class="form-label">Bonus Score</label>
                    <input type="number" th:field="*{bonusScore}" class="form-control" id="bonusScore" 
                           required min="0" placeholder="Enter bonus score">
                    <div class="invalid-feedback">
                        Bonus score is required and must be a non-negative number.
                    </div>
                </div>

                <!-- Term -->
                <div class="mb-3">
                    <label for="termId" class="form-label">Term</label>
                    <select th:field="*{termId}" class="form-select" id="termId" required>
                        <option value="">Select a term</option>
                        <option th:each="term : ${terms}" 
                                th:value="${term.id}" 
                                th:text="${term.name}"></option>
                    </select>
                    <div class="invalid-feedback">
                        Term is required.
                    </div>
                </div>

                <!-- Semester -->
                <div class="mb-3">
                    <label for="semesterId" class="form-label">Semester</label>
                    <select th:field="*{semesterId}" class="form-select" id="semesterId" required>
                        <option value="">Select a semester</option>
                        <option th:each="semester : ${semesters}" 
                                th:value="${semester.id}" 
                                th:text="${semester.name}"></option>
                    </select>
                    <div class="invalid-feedback">
                        Semester is required.
                    </div>
                </div>

                <!-- Student Assistant -->
                <div class="mb-3">
                    <label for="studentAssistantId" class="form-label">AssistantId</label>
                    <input type="text" th:value="${activity.studentAssistantId.id}" class="form-control" id="studentAssistantId" 
                           required minlength="1" maxlength="255" readonly>
                    <div class="invalid-feedback">
                        Title is required and must be between 1 and 255 characters.
                    </div>
                </div>

                <!-- Submit and Cancel Buttons -->
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/affairs/activities}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>

    <th:block id="custom-javascripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Bootstrap form validation
            (function () {
                'use strict'
                var forms = document.querySelectorAll('.needs-validation')
                Array.prototype.slice.call(forms).forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
            })()
        </script>
    </th:block>
</body>
</html>
