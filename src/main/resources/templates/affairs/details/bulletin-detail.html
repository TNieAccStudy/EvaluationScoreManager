<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{affairs/base :: base(~{::title}, ~{::div.content}, ~{::#custom-links}, ~{::#custom-javascripts})}">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bulletin list template</title>

        <th:block id="custom-links">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        </th:block>

    </header>
    <body>

        <div class="content">
            <form th:action="@{/affairs/exec/bulletins}" th:object="${bulletin}" method="POST" >
                <!-- Hidden field for ID -->
                <input type="hidden" th:field="*{id}" />

                <!-- Title -->
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" th:field="*{title}" class="form-control" id="title" 
                           required minlength="1" maxlength="255" placeholder="Enter bulletin title">
                    <div class="invalid-feedback">
                        Title is required and must be between 1 and 255 characters.
                    </div>
                </div>

                <!-- Content -->
                <div class="mb-3">
                    <label for="content" class="form-label">Content</label>
                    <textarea th:field="*{content}" class="form-control" id="content" rows="5" 
                              maxlength="2147483647" placeholder="Enter bulletin content"></textarea>
                    <div class="invalid-feedback">
                        Content is required.
                    </div>
                </div>

                <!-- End Date -->
                <div class="mb-3">
                    <label for="duration" class="form-label">End Date</label>
                    <input type="datetime-local" th:field="*{duration}" class="form-control" id="duration" required>
                    <div class="invalid-feedback">
                        End date is required.
                    </div>
                </div>

                <!-- Semester -->
                <div class="mb-3">
                    <label for="semester" class="form-label">Semester</label>
                    <select th:field="*{semesterId.id}" class="form-select" id="semester" required>
                        <option value="">Select a semester</option>
                        <option th:each="semester : ${semesters}" 
                                th:value="${semester.id}" 
                                th:text="${semester.name}"></option>
                    </select>
                    <div class="invalid-feedback">
                        Semester is required.
                    </div>
                </div>

                <!-- State -->
                <div class="mb-3">
                    <label for="state" class="form-label">State</label>
                    <select th:field="*{state}" class="form-select" id="state" required>
                        <option value="">Select state</option>
                        <option th:each="state : ${bulletinStates}"
                                th:value="${state.name()}"
                                th:text="${state.name()}"></option>
                    </select>
                    <div class="invalid-feedback">
                        State is required.
                    </div>
                </div>

                <!-- Submit and Cancel Buttons -->
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/affairs/bulletins}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>

    <th:block id="custom-javascripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Bootstrap form validation
            (function () {
                'use strict'
                var forms = document.querySelectorAll('.needs-validation')
                Array.prototype.slice.call(forms).forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
            })()
        </script>
    </th:block>
</body>
</html>
