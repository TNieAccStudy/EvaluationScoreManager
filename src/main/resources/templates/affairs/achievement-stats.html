<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{affairs/base :: base(~{::title}, ~{::div.content}, ~{::#custom-links}, ~{::#custom-javascripts})}">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Class Stats</title>

        <th:block id="custom-links">
            <link rel="stylesheet" th:href="@{/affairs/css/achievement-stats.css}" />
        </th:block>
    </header>
    <body>
        <div class="content">
            <!-- Loại bỏ phần controls (select và nút) -->
            <!-- Bảng thống kê -->
            <div class="table-container">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Total Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="data : ${datas}">
                            <td th:text="${data.name}"></td>
                            <td th:text="${data.totalScore}"></td>
                        </tr>
                        <!-- Dữ liệu mẫu nếu không có từ backend -->
                        <tr th:unless="${datas}">
                            <td>John Doe</td>
                            <td>85</td>
                        </tr>
                        <tr th:unless="${datas}">
                            <td>Jane Smith</td>
                            <td>92</td>
                        </tr>
                        <tr th:unless="${datas}">
                            <td>Michael Brown</td>
                            <td>78</td>
                        </tr>
                        <tr th:unless="${datas}">
                            <td>Sarah Davis</td>
                            <td>95</td>
                        </tr>
                        <tr th:unless="${datas}">
                            <td>Robert Wilson</td>
                            <td>88</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    <th:block id="custom-javascripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
</body>
</html>
