<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{affairs/base :: base(~{::title}, ~{::div.content}, ~{::#custom-links}, ~{::#custom-javascripts})}">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Department stats template</title>

        <th:block id="custom-links">
            <link rel="stylesheet" th:href="@{/affairs/css/department-stats.css}" />

        </th:block>

    </header>
    <body>
        <div class="content">
            <!-- Điều khiển chọn semester và nút -->
            <div class="controls">
                <label for="semesterId" class="form-label">Select Semester</label>
                <select class="form-select" id="semesterId" name="semesterId">
                    <option value="">Select a semester</option>
                    <option th:each="semester : ${semesters}" th:value="${semester.id}" th:text="${semester.name}"></option>
                    <!-- Dữ liệu mẫu nếu không có từ backend -->
                    <option th:unless="${semesters}" value="1">Semester 1</option>
                    <option th:unless="${semesters}" value="2">Semester 2</option>
                    <option th:unless="${semesters}" value="3">Semester 3</option>
                </select>
                <button class="btn btn-primary" onclick="submitSemester()">Submit</button>
            </div>

            <!-- Bảng thống kê -->
            <div class="table-container">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Department Name</th>
                            <th>Total Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="data : ${datas}">
                            <td th:text="${data.name}"></td>
                            <td th:text="${data.totalScore}"></td>
                        </tr>
                        <!-- Dữ liệu mẫu nếu không có từ backend -->
                        <tr th:unless="${datas}">
                            <td>John Doe</td>
                            <td>85</td>
                        </tr>
                        <tr th:unless="${datas}">
                            <td>Jane Smith</td>
                            <td>92</td>
                        </tr>
                        <tr th:unless="${datas}">
                            <td>Michael Brown</td>
                            <td>78</td>
                        </tr>
                        <tr th:unless="${datas}">
                            <td>Sarah Davis</td>
                            <td>95</td>
                        </tr>
                        <tr th:unless="${datas}">
                            <td>Robert Wilson</td>
                            <td>88</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    <th:block id="custom-javascripts" th:inline="javascript">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
                function submitSemester() {
                    var semesterId = document.getElementById('semesterId').value;
                    if (semesterId) {
                        var baseUrl = /*[[@{/affairs/stats/department}]]*/ '';
                        window.location.href = baseUrl + '?semesterId=' + semesterId;
                    } else {
                        alert('Please select a semester!');
                    }
                }
            </script>
    </th:block>
</body>
</html>
