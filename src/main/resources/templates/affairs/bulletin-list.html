<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{affairs/base :: base(~{::title}, ~{::div.content}, ~{::#custom-links}, ~{::#custom-javascripts})}">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bulletin list template</title>

        <th:block id="custom-links">
            <link rel="stylesheet" th:href="@{/affairs/css/bulletin-list.css}" />
        </th:block>
    </header>
    <body>
        <div class="content">
            <div class="nodes-section">
                <div class="section-header">
                    <h2>Node Configurations</h2>
                    <p>Manage and review configured nodes for student affairs operations</p>
                </div>
                <div class="nodes-table">
                    <div class="table-header">
                        <span class="table-column">Bulletin ID</span>
                        <span class="table-column">Title</span>
                        <span class="table-column">Endtime</span>
                        <span class="table-column">Semester</span>
                        <span class="table-column">Assistant name</span>
                        <span class="table-column">Assistant mail</span>
                        <span class="table-column">State</span>
                        <span class="table-column">Actions</span>
                    </div>

                    <div th:each="b : ${bulletins}">
                        <div class="table-row">
                            <span class="table-column" th:text="${b.id}" data-label="Bulletin ID">1</span>
                            <span class="table-column" th:text="${b.title}" data-label="Title">Bulletin title</span>
                            <span class="table-column" th:text="${#dates.format(b.duration, 'yyyy-MM-dd HH:mm')}" data-label="Endtime">2025-05-18 14:30</span>
                            <span class="table-column" th:text="${#strings.concat(b.semesterId.name, ' - ', b.semesterId.year)}" data-label="Semester">HK1 - 2025</span>
                            <span class="table-column" th:text="${b.studentAssistantId.firstName + ' ' + b.studentAssistantId.lastName}" data-label="Assistant name">Nguyen Van A</span>
                            <span class="table-column" th:text="${b.studentAssistantId.email}" data-label="Assistant mail">nva@example.com</span>
                            <span class="table-column" th:text="${b.state}" data-label="State">OPENING</span>
                            <span class="table-column" data-label="Actions">
                                <a class="action-button edit" 
                                   th:href="@{/affairs/bulletins/{id}(id=${b.id})}">
                                    Edit
                                </a>
                                <button class="action-button delete" th:onclick="'deleteItem(\'' + @{/api/bulletins/} + '\',' + ${b.id} + ')'">Delete</button>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <th:block id="custom-javascripts" />
    </body>
</html>
