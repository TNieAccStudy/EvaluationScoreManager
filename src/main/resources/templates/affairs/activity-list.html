<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{affairs/base :: base(~{::title}, ~{::div.content}, ~{::#custom-links}, ~{::#custom-javascripts})}">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Activity list template</title>

        <th:block id="custom-links">
            <link rel="stylesheet" th:href="@{/affairs/css/activity-list.css}" />
        </th:block>
    </header>
    <body>
        <div class="content">
            <div class="nodes-section">
                <div class="section-header">
                    <h2>Node Configurations</h2>
                    <p>Manage and review configured nodes for student affairs operations</p>
                </div>
                <div class="nodes-table">
                    <div class="table-header">
                        <span class="table-column">Activity ID</span>
                        <span class="table-column">Bonus scores</span>
                        <span class="table-column">Title</span>
                        <span class="table-column">Semester</span>
                        <span class="table-column">Term</span>
                        <span class="table-column">Assistant name</span>
                        <span class="table-column">Assistant mail</span>
                        <span class="table-column">Actions</span>
                    </div>

                    <div th:each="a : ${activities}">
                        <div class="table-row">
                            <span class="table-column" th:text="${a.id}" data-label="Activity ID">1</span>
                            <span class="table-column" th:text="${a.bonusScore}" data-label="Bonus scores">20</span>
                            <span class="table-column" th:text="${a.title}" data-label="Title">Bulletin title</span>
                            <span class="table-column" th:text="${#strings.concat(a.semesterId.name, ' - ', a.semesterId.year)}" data-label="Semester">HK1 - 2025</span>
                            <span class="table-column" th:text="${#strings.concat(a.termId.name, ' - ', a.termId.maxValue)}" data-label="Term">Dieu khoan 1 - 20</span>
                            <span class="table-column" th:text="${a.studentAssistantId.firstName + ' ' + a.studentAssistantId.lastName}" data-label="Assistant name">Nguyen Van A</span>
                            <span class="table-column" th:text="${a.studentAssistantId.email}" data-label="Assistant mail">nva@example.com</span>
                            <span class="table-column" data-label="Actions">
                                <a class="action-button edit" 
                                   th:href="@{/affairs/activities/{id}(id=${a.id})}">
                                    Edit
                                </a>
                                <button class="action-button delete" th:onclick="'deleteItem(\'' + @{/api/activities/} + '\',' + ${a.id} + ')'">Delete</button>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <th:block id="custom-javascripts" />
    </body>
</html>
